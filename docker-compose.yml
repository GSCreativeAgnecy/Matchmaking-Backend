name: matchmaking

# Everything uses `expose` (internal-only within the Compose network). No host
# ports are published - a platform edge proxy (e.g. Coolify) routes a domain to
# the nginx `proxy` service, which is the single application origin:
#   /               -> admin dashboard (Next.js)
#   /api/v1/*       -> FastAPI
#   /api/auth/*     -> admin BFF (HttpOnly refresh cookie)
# Data stores (postgres, redis) are never published to the host.

services:
  proxy:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    # No host port: the platform's edge proxy (e.g. Coolify) routes a domain
    # to this container on port 80. Publishing :80 on the host conflicts with
    # other services / the platform proxy itself.
    expose:
      - "80"
    depends_on:
      - admin
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://matchmake:matchmake@postgres:5432/matchmaking
      REDIS_URL: redis://redis:6379/0
      # ARQ worker/enqueue pool - separate DB index, also the redis service.
      ARQ_REDIS_URL: redis://redis:6379/1
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/storage
      ENVIRONMENT: development
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      # Allow the browser-origin admin dashboard to call the API through the proxy.
      CORS_ORIGINS: '["http://localhost"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: .
    command: arq app.workers.arq_app.WorkerSettings
    volumes:
      - ./app:/app/app
    environment:
      DATABASE_URL: postgresql+asyncpg://matchmake:matchmake@postgres:5432/matchmaking
      REDIS_URL: redis://redis:6379/0
      # ARQ worker pool - separate DB index, also the redis service.
      ARQ_REDIS_URL: redis://redis:6379/1
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/storage
      ENVIRONMENT: development
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; redis.Redis.from_url('redis://redis:6379/1', socket_connect_timeout=3).ping()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  admin:
    build:
      context: ./admin
      args:
        # Empty on purpose: the browser calls the same origin (/api/v1) and the
        # proxy routes it to the API. Never put secrets in a NEXT_PUBLIC_* arg.
        NEXT_PUBLIC_API_URL: ""
    environment:
      # Server-only internal API target for the BFF auth routes (not inlined).
      ADMIN_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ""
      NODE_ENV: production
      PORT: 3001
    expose:
      - "3001"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: matchmake
      POSTGRES_PASSWORD: matchmake
      POSTGRES_DB: matchmaking
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchmake -d matchmaking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: >
      sh -c "alembic upgrade head && python -m app.seed"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://matchmake:matchmake@postgres:5432/matchmaking
      REDIS_URL: redis://redis:6379/0
      # ARQ enqueue pool - separate DB index, also the redis service.
      ARQ_REDIS_URL: redis://redis:6379/1
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/storage
      ENVIRONMENT: development
      # Optional dev-only SUPER_ADMIN, created by `python -m app.seed`.
      # Leave unset (empty) in production. Never commit real credentials.
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}

volumes:
  pgdata:
